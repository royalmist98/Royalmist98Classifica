<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabellone Torneo - Royalmist98</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="https://i.imgur.com/P0CBe9H.png" alt="Logo" class="logo">
        <h1>SCALATA AL TITOLO</h1>
    </header>

    <div class="bracket-wrapper">
        
        <div class="tier">
            <div class="winner-container">
                <div class="crown">🏆</div>
                <div class="slot winner-slot"><strong>???</strong></div>
                <div class="label-tier">VINCITORE DEL TORNEO</div>
            </div>
        </div>

        <div class="tier connector-line">
            <div class="matchup-row">
                <div class="slot shadow-gold"><strong>???</strong></div>
                <div class="vs-mini">VS</div>
                <div class="slot shadow-gold"><strong>???</strong></div>
            </div>
            <div class="label-tier">FINALE</div>
        </div>

        <div class="tier connector-line-double">
            <div class="group-row">
                <div class="matchup-row">
                    <div class="slot"><strong>???</strong></div>
                    <div class="vs-mini">VS</div>
                    <div class="slot"><strong>???</strong></div>
                </div>
                <div class="matchup-row">
                    <div class="slot"><strong>???</strong></div>
                    <div class="vs-mini">VS</div>
                    <div class="slot"><strong>???</strong></div>
                </div>
            </div>
            <div class="label-tier">SEMIFINALI</div>
        </div>

        <div class="tier connector-line-quad">
            <div class="group-row">
                <div class="matchup-row highlight-match">
                    <div class="slot"><strong>Star</strong></div>
                    <div class="vs-mini">VS</div>
                    <div class="slot"><strong>???</strong></div>
                </div>
                <div class="matchup-row">
                    <div class="slot"><strong>Macro</strong></div>
                    <div class="vs-mini">VS</div>
                    <div class="slot"><strong>Bomberman</strong></div>
                </div>
                <div class="matchup-row">
                    <div class="slot"><strong>Powerox</strong></div>
                    <div class="vs-mini">VS</div>
                    <div class="slot"><strong>PugNGlease</strong></div>
                </div>
                <div class="matchup-row">
                    <div class="slot"><strong>VinMarco</strong></div>
                    <div class="vs-mini">VS</div>
                    <div class="slot"><strong>Leone di Vibo</strong></div>
                </div>
            </div>
            <div class="label-tier">QUARTI DI FINALE</div>
        </div>

        <div class="tier">
            <div class="matchup-row prelim-base">
                <div class="slot"><strong>SubatomicFox</strong></div>
                <div class="vs-mini">VS</div>
                <div class="slot"><strong>Rinkasho</strong></div>
            </div>
            <div class="label-tier">TURNO PRELIMINARE</div>
        </div>

    </div>

    <div style="text-align: center; margin: 50px 0;">
        <a href="index.html" class="btn-enter" style="text-decoration: none; border: 1px solid var(--gold); padding: 10px 20px; border-radius: 5px;">TORNA ALL'HUB</a>
    </div>

</body>
</html>
