<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royalmist98 | Official Brand</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">ROYALMIST98</div>
            <button id="menuBtn" class="menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
            <ul id="dropdownMenu" class="nav-links hidden">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="locanda.html"><i class="fas fa-scroll"></i> La Locanda</a></li>
                <li><a href="https://www.twitch.tv/royalmist98" target="_blank"><i class="fab fa-twitch"></i> Twitch</a></li>
                <li><a href="https://www.youtube.com/@RoyalMist98" target="_blank"><i class="fab fa-youtube"></i> YouTube</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero-header fade-in">
        <div class="hero-content">
            <img src="https://static-cdn.jtvnw.net/jtv_user_pictures/584a4764-cdec-45b8-b26b-d2500895bf2c-profile_image-150x150.png" alt="Royalmist98" class="main-avatar">
            <h1 class="brand-title">ROYALMIST98</h1>
            <p class="brand-subtitle">STREAMER • DUELIST • CREATOR</p>
        </div>
    </header>

    <main class="portal-grid fade-in">
        
        <div class="card-professional locanda-card">
            <div class="card-overlay">
                <i class="fas fa-chess-rook card-icon"></i>
                <h2>LA LOCANDA</h2>
                <p>Tornei Genesys & Edison, Classifiche e Fazioni.</p>
                <a href="locanda.html" class="btn-pro">Entra Ora</a>
            </div>
        </div>

        <div class="card-professional social-card">
            <div class="card-overlay">
                <i class="fab fa-twitch card-icon"></i>
                <h2>COMMUNITY</h2>
                <p>Segui le dirette e unisciti al gruppo dei duellanti.</p>
                <div class="social-links-pro">
                    <a href="https://www.twitch.tv/royalmist98" target="_blank"><i class="fab fa-twitch"></i></a>
                    <a href="https://www.youtube.com/@RoyalMist98" target="_blank"><i class="fab fa-youtube"></i></a>
                    <a href="https://www.instagram.com/royalmist98/" target="_blank"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>

    </main>

    <footer class="main-footer fade-in">
        <p>&copy; 2026 ROYALMIST98. Creato per i Duellanti.</p>
    </footer>

    <script>
        /* ===== MENU MOBILE ===== */
        const menuBtn = document.getElementById('menuBtn');
        const dropdown = document.getElementById('dropdownMenu');

        menuBtn.addEventListener('click', () => {
            dropdown.classList.toggle('hidden');
        });

        document.querySelectorAll('#dropdownMenu a').forEach(link => {
            link.addEventListener('click', () => {
                dropdown.classList.add('hidden');
            });
        });

        /* ===== FADE-IN ALLO SCROLL ===== */
        const sections = document.querySelectorAll('.fade-in');

        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show');
                }
            });
        }, { threshold: 0.1 });

        sections.forEach(section => observer.observe(section));
    </script>
</body>
</html>
